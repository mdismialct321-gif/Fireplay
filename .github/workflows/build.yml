name: Build FirePlay APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      - name: Save our code
        run: |
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/my.dart; fi
      - name: Create project
        run: flutter create --project-name fireplay --org com.fireplay.app --platforms android.
      - name: Restore our code
        run: |
          if [ -f /tmp/my.dart ]; then cp /tmp/my.dart lib/main.dart; fi
      - name: Add packages
        run: |
          flutter pub add http cached_network_image youtube_player_flutter
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FirePlay-APK
          path: build/app/outputs/flutter-apk/app-release.apk
